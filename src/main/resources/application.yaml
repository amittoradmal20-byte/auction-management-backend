spring:
  application:
    name: auction-management-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/auction_ai
    username: postgres
    password: welcome
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: 8Kx9LmP2Qv7Rt5Yn3Hs8Wc4Bd6Fg1Jk9Np2Qr7St8Uv5Wx3Za6Bc9De2Fh4Gi7Jl
    access-token-expiration: 3600000        # 1 Hour
    refresh-token-expiration: 604800000     # 7 Days

  refresh-token:
    expiration: 604800000                   # 7 Days

logging:
  level:
    root: INFO

    # Application Logs
    com.auction: DEBUG

    # Spring Security
    org.springframework.security: INFO

    # Hibernate
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

    # Spring Framework
    org.springframework.web: INFO
    org.springframework.transaction: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"

  file:
    name: logs/auction-management.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never